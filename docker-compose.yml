version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: crypto-agent-db
    environment:
      POSTGRES_USER: ${DB_USER:-crypto_agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crypto_agent_password}
      POSTGRES_DB: ${DB_NAME:-crypto_agent}
    # Port NOT exposed to host — only accessible within Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crypto_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for future Message Bus extension)
  redis:
    image: redis:7-alpine
    container_name: crypto-agent-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_2024}
    # Port NOT exposed to host — only accessible within Docker network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crypto Trading Agent
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-agent-app
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BINANCE_USE_TESTNET=${BINANCE_USE_TESTNET:-true}
      - DRY_RUN=${DRY_RUN:-true}
      - ALLOW_REAL_TRADING=${ALLOW_REAL_TRADING:-false}
      - AGENT_MODE=${AGENT_MODE:-suggest}
      - DB_URL=postgresql://${DB_USER:-crypto_agent}:${DB_PASSWORD:-crypto_agent_password}@postgres:5432/${DB_NAME:-crypto_agent}
      - DB_USER=${DB_USER:-crypto_agent}
      - DB_PASSWORD=${DB_PASSWORD:-crypto_agent_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-crypto_agent}
      - PORTFOLIO_ALLOCATION_PCT=${PORTFOLIO_ALLOCATION_PCT:-100.0}
      - MIN_PAIR_CONFIDENCE_SCORE=${MIN_PAIR_CONFIDENCE_SCORE:-50.0}
      - MAX_RISK_PER_PAIR_PCT=${MAX_RISK_PER_PAIR_PCT:-10.0}
      - DIVERSIFICATION_FACTOR=${DIVERSIFICATION_FACTOR:-1.0}
      - ENABLE_POSITION_CLOSURE=${ENABLE_POSITION_CLOSURE:-true}
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis_2024}
      - CRYPTOCOMPARE_API_KEY=${CRYPTOCOMPARE_API_KEY:-}
      - MAX_PER_TRADE_USDT=${MAX_PER_TRADE_USDT:-350.0}
      - MAX_POSITIONS=${MAX_POSITIONS:-15}
      - MAX_POSITIONS_PER_SYMBOL=${MAX_POSITIONS_PER_SYMBOL:-1}
      - MAX_POSITIONS_SPOT_BULL=${MAX_POSITIONS_SPOT_BULL:-20}
      - MAX_POSITIONS_RANGE_SCALP=${MAX_POSITIONS_RANGE_SCALP:-10}
      - OVERFLOW_MAX_EXTRA=${OVERFLOW_MAX_EXTRA:-5}
      # E1: Expansión activos 24→32 tokens (formato JSON array para pydantic)
      - ANALYSIS_SYMBOLS=["DOGEUSDT","RENDERUSDT","BNBUSDT","SOLUSDT","TAOUSDT","FETUSDT","AVAXUSDT","ADAUSDT","XRPUSDT","DOTUSDT","SUIUSDT","PEPEUSDT","WIFUSDT","BTCUSDT","ETHUSDT","LINKUSDT","NEARUSDT","WLDUSDT","INJUSDT","AGIXUSDT","ONDOUSDT","JUPUSDT","OPUSDT","HBARUSDT","AAVEUSDT","ARBUSDT","MATICUSDT","ATOMUSDT","GRTUSDT","AIOZUSDT","SEIUSDT","SUSHIUSDT"]
      # Futures SHORT — pares elegibles, SL/TP, límites (F2 expansión jun 18 2026: 8→19 pares)
      - FUTURES_SYMBOLS=["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","ADAUSDT","NEARUSDT","SUIUSDT","DOGEUSDT","AVAXUSDT","LINKUSDT","TAOUSDT","UNIUSDT","DOTUSDT","PEPEUSDT","BCHUSDT","AAVEUSDT","FILUSDT","INJUSDT"]
      - FUTURES_SL_PCT=7.0
      - FUTURES_TP_PCT=${FUTURES_TP_PCT:-7.0}
      - FUTURES_MAX_SHORTS=9
      - FUTURES_MAX_LARGECAP_SHORTS=5
      - FUTURES_LARGECAP_SYMBOLS=["BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT","SOLUSDT"]
      - FUTURES_OVERFLOW_MAX_EXTRA=${FUTURES_OVERFLOW_MAX_EXTRA:-3}
      - FUTURES_OVERFLOW_MIN_STRENGTH=0.65
      - FUTURES_OVERFLOW_MIN_VOL_SPIKE=${FUTURES_OVERFLOW_MIN_VOL_SPIKE:-2.0}
      - FUTURES_OVERFLOW_MIN_DROP_24H=-3.0
      - FUTURES_KELLY_CAP_PCT=0.20
      - FUTURES_CAPITAL_BRIDGE_ENABLED=true
      - FUTURES_CAPITAL_BRIDGE_MIN_TRANSFER=10.0
      # PB (Profit Boost) sesion 16 jun21 2026
      - FUTURES_SL_COOLDOWN_HOURS=4.0
      - FUTURES_MAX_NEW_PER_CYCLE=3
      - FUTURES_MASS_SL_THRESHOLD=3
      - FUTURES_MASS_SL_COOLDOWN_HOURS=4.0
      - FUTURES_CONFIRM_RED_CANDLE=true
      - FUTURES_NO_SHORT_BTC_3H_THRESHOLD=1.0
      - FUTURES_USDT_PER_TRADE=50.0
      # H-FIXES sesion 8 jun21 2026
      - FUTURES_TRAILING_ACTIVATION_PCT=2.0
      # SL-OPT sesion 19 jun22 2026 — wider SL + SSO adaptive exits
      - STOP_LOSS_PCT=2.5
      - ATR_SL_MIN_PCT=0.015
      - FUTURES_BREAKEVEN_ACTIVATION_PCT=1.0
      - FUTURES_SMART_TP_EXTEND_SCORE_THRESHOLD=2
      - FUTURES_PROTECT_PROFIT_USDT=-5.0
      - MIN_CYCLES_BEFORE_CLOSE_SHORTS=5
      - CYCLE_FUTURES_SHORT=4
      - FUTURES_MIN_INJECT_STRENGTH=0.40
      # PV (Profit Velocity) sesion 17 jun21 2026 — scale-out + momentum reversal
      - FUTURES_SCALE_OUT_PCT=1.5
      - FUTURES_SCALE_OUT_FRACTION=0.5
      - FUTURES_MOMENTUM_REVERSAL_ENABLED=true
      - FUTURES_MOMENTUM_REVERSAL_MIN_PEAK=2.0
      - FUTURES_MOMENTUM_REVERSAL_DRAWBACK=0.8
      # SSO (Smart Scale-Out) sesion 19 jun22 2026
      - SSO_ENABLED=true
      - SSO_STAGNANT_MIN_HOURS=2.0
      - SSO_STAGNANT_MIN_PROFIT_FLOOR=3.0
      - SSO_MOMENTUM_RSI_OVERBOUGHT=70
      - SSO_MULTILEVEL_ENABLED=true
      - SSO_MULTILEVEL_L1_ATR_MULT=1.0
      - SSO_MULTILEVEL_L2_ATR_MULT=2.0
      - SSO_MULTILEVEL_L3_ATR_MULT=3.5
      - SSO_TARGET_DAILY_USD=40.0
      - SSO_TARGET_CONTRIBUTION_PCT=0.15
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./frontend:/app/frontend
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
