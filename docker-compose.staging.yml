# DEPRECATED IN THE PRODUCTION WORKTREE — DO NOT RUN FROM HERE.
#
# Root cause of the s130 incident (Aug 16 2026): this file used to bind-mount
# `.` from THIS directory, which is the same working tree that production runs
# from. That meant "staging" and "production" executed the exact same code —
# there was no real isolation, so changes believed to be under test in staging
# were already live in production.
#
# Fix: staging now lives in its own git worktree, checked out on the `staging`
# branch, at a sibling directory:
#
#     S:\Tools\AI\crypto-agent-staging   (branch: staging)
#
# The real, authoritative docker-compose.staging.yml lives there and mounts
# that directory's own `.`, not this one. To operate staging:
#
#     cd S:\Tools\AI\crypto-agent-staging
#     docker compose -f docker-compose.staging.yml --env-file .env.staging.example up -d --build
#
# Promotion flow (staging -> production):
#   1. Develop and test in S:\Tools\AI\crypto-agent-staging (branch `staging`).
#   2. Commit there.
#   3. From THIS directory (production worktree, branch redesign-lifecycle-20260713):
#        git merge staging   (review diff first: git diff redesign-lifecycle-20260713..staging)
#   4. Restart the production app container to pick up the merged code.
#
# See canonical/staging_env.md for full details.

